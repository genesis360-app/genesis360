name: Sweeps periódicos (intereses CC + reservas vencidas + cotización BNA)

on:
  schedule:
    # Todos los días a las 6:10 AM UTC (3:10 AM Argentina) — antes del horario comercial
    - cron: '10 6 * * *'
  workflow_dispatch:  # Permite ejecución manual

jobs:
  sweeps:
    runs-on: ubuntu-latest
    steps:
      - name: Call cron-sweeps Edge Function
        run: |
          curl -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/cron-sweeps" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail \
            --silent \
            --show-error

      # D-1 (mig 439): cotización DIVISA del BNA. A las 03:10 AR la página todavía muestra el cierre
      # del día hábil anterior, con su fecha — la tasa de la RG 5616. Falla (502) si no pudo capturar,
      # para que el workflow quede rojo y se vea.
      - name: Call cotizacion-bna Edge Function
        if: always()  # independiente: que falle un sweep no deja al día sin cotización
        run: |
          curl -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/cotizacion-bna" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail \
            --silent \
            --show-error
